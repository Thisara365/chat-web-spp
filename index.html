<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open a Line — Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0f18;
    --bg-glow: radial-gradient(circle at 20% -10%, rgba(232,163,61,0.10), transparent 45%),
               radial-gradient(circle at 100% 10%, rgba(73,198,184,0.08), transparent 40%);
    --panel:#121a28;
    --panel-2:#161f30;
    --line:#22304a;
    --line-soft:#1a2438;
    --amber:#e8a33d;
    --teal:#49c6b8;
    --text:#eef2f7;
    --muted:#7c8aa0;
    --muted-dim:#556076;
    --danger:#e87d5b;
    --disp: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --bg-rgb: 10,15,24;
  }
  body[data-theme="light"]{
    --bg-rgb: 244,242,238;
  }
  .theme-toggle{position:fixed;top:18px;right:18px;width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:10;
    box-shadow:0 4px 14px -6px rgba(0,0,0,0.3);}
  .theme-toggle:hover{border-color:var(--amber);}
  .theme-toggle svg{width:17px;height:17px;}
  .chat-header .theme-toggle{position:static;box-shadow:none;width:34px;height:34px;}
  body[data-theme="light"]{
    --bg:#f4f2ee;
    --bg-glow: radial-gradient(circle at 20% -10%, rgba(232,163,61,0.14), transparent 45%),
               radial-gradient(circle at 100% 10%, rgba(73,198,184,0.10), transparent 40%);
    --panel:#ffffff;
    --panel-2:#f9f7f3;
    --line:#e2ddd3;
    --line-soft:#ece7dd;
    --amber:#d98f26;
    --teal:#2f9e91;
    --text:#20242c;
    --muted:#767b87;
    --muted-dim:#9a9fab;
    --danger:#c85a3c;
  }
  body{transition:background 0.2s ease, color 0.2s ease;}
  *{transition:background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background-color:var(--bg);background-image:var(--bg-glow);
    background-repeat:no-repeat;background-attachment:fixed;background-size:cover;
    color:var(--text);font-family:var(--disp);-webkit-font-smoothing:antialiased;min-height:100vh;}
  #root{min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .mono{font-family:var(--mono);}
  input{font-family:inherit;}
  button{font-family:inherit;}
  ::selection{background:rgba(232,163,61,0.3);}

  .msg-list::-webkit-scrollbar{width:6px;}
  .msg-list::-webkit-scrollbar-track{background:transparent;}
  .msg-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  .msg-list::-webkit-scrollbar-thumb:hover{background:var(--muted-dim);}

  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,163,61,0.45); }
    50%{ box-shadow:0 0 0 6px rgba(232,163,61,0); }
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes barWave{
    0%,100%{ transform:scaleY(0.35); }
    50%{ transform:scaleY(1); }
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  .join-wrap{min-height:100vh;width:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:28px;animation:fadeIn 0.4s ease;}

  .signal-hero{display:flex;align-items:flex-end;gap:4px;height:36px;margin-bottom:22px;}
  .signal-hero .bar{width:5px;border-radius:3px;
    background:linear-gradient(180deg,var(--amber),var(--teal));
    animation:barWave 1.4s ease-in-out infinite;transform-origin:bottom;}
  .signal-hero .bar:nth-child(1){height:14px;animation-delay:0s;}
  .signal-hero .bar:nth-child(2){height:24px;animation-delay:0.12s;}
  .signal-hero .bar:nth-child(3){height:36px;animation-delay:0.24s;}
  .signal-hero .bar:nth-child(4){height:20px;animation-delay:0.36s;}
  .signal-hero .bar:nth-child(5){height:30px;animation-delay:0.48s;}
  .signal-hero .bar:nth-child(6){height:12px;animation-delay:0.6s;}

  .join-card{width:100%;max-width:390px;background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:14px;padding:34px 30px;
    box-shadow:0 20px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 10px var(--amber);display:inline-block;animation:pulse 2s infinite;}
  .dot.live{background:var(--teal);box-shadow:0 0 10px var(--teal);}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:0.18em;color:var(--muted);
    text-transform:uppercase;vertical-align:middle;margin-left:8px;}
  .join-title{font-size:28px;font-weight:700;margin:10px 0 26px 0;letter-spacing:-0.02em;}

  .field-label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:7px;
    letter-spacing:0.03em;text-transform:uppercase;}
  .field-input{width:100%;padding:12px 14px;margin-bottom:20px;border-radius:8px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);
    font-size:15px;outline:none;transition:border-color 0.15s, box-shadow 0.15s;}
  .field-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,0.12);}
  .field-input::placeholder{color:var(--muted-dim);}

  .hint{font-size:12.5px;color:var(--muted);margin:-8px 0 24px 0;line-height:1.55;}
  .join-btn{width:100%;padding:13px;border-radius:8px;border:none;
    background:linear-gradient(180deg,#f0ae4c,var(--amber));color:#1a1305;font-size:15px;font-weight:700;
    cursor:pointer;letter-spacing:0.01em;transition:transform 0.1s, filter 0.15s;}
  .join-btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px);}
  .join-btn:active:not(:disabled){transform:translateY(0);}
  .join-btn:disabled{background:#1c2536;color:var(--muted-dim);cursor:not-allowed;}
  .footnote{margin-top:18px;font-size:11.5px;color:var(--muted-dim);text-align:center;max-width:320px;line-height:1.5;}

  .chat-wrap{width:100%;max-width:540px;min-height:100vh;display:flex;flex-direction:column;animation:fadeIn 0.3s ease;}
  .chat-header{padding:16px 20px;border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;background:rgba(var(--bg-rgb),0.85);backdrop-filter:blur(10px);z-index:2;}
  .header-left{display:flex;align-items:center;gap:12px;}
  .avatar-ring{width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--teal),#2f8a80);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:600;font-size:13px;color:#06231f;
    box-shadow:0 0 0 3px rgba(73,198,184,0.12);}
  .room-name{font-size:14px;font-weight:600;letter-spacing:0.01em;}
  .as-name{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .presence-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);
    display:inline-block;margin-right:5px;box-shadow:0 0 6px var(--teal);animation:pulse 2s infinite;}
  .leave-btn{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
  .leave-btn:hover{border-color:var(--danger);color:var(--danger);}

  .msg-list{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
  .empty-state{color:var(--muted);font-size:13px;text-align:center;margin-top:60px;line-height:1.7;}
  .empty-icon{display:flex;justify-content:center;gap:3px;margin-bottom:14px;opacity:0.5;}
  .empty-icon .bar{width:4px;border-radius:2px;background:var(--muted);}
  .empty-icon .bar:nth-child(1){height:8px;}
  .empty-icon .bar:nth-child(2){height:16px;}
  .empty-icon .bar:nth-child(3){height:22px;}
  .empty-icon .bar:nth-child(4){height:12px;}

  .msg-row{max-width:76%;display:flex;flex-direction:column;animation:riseIn 0.25s ease;}
  .msg-row.mine{align-self:flex-end;align-items:flex-end;}
  .msg-row.theirs{align-self:flex-start;align-items:flex-start;}
  .sender-label{font-size:11px;color:var(--muted);margin-bottom:4px;margin-left:4px;font-weight:500;}
  .bubble{padding:10px 14px;font-size:14.5px;line-height:1.5;word-break:break-word;}
  .bubble.mine{background:linear-gradient(135deg,#f0ae4c,var(--amber));color:#1a1305;
    border-radius:14px 14px 3px 14px;box-shadow:0 4px 14px -6px rgba(232,163,61,0.4);}
  .bubble.theirs{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:14px 14px 14px 3px;}
  .time-label{font-size:10px;color:var(--muted-dim);margin-top:4px;margin-left:5px;margin-right:5px;
    font-family:var(--mono);}

  .error-line{padding:6px 20px;font-size:12px;color:var(--danger);animation:riseIn 0.2s ease;}
  .typing-line{padding:2px 20px 8px 20px;font-size:12px;color:var(--muted);
    font-style:italic;animation:fadeIn 0.2s ease;}
  .typing-dots{display:inline-flex;gap:2px;margin-left:5px;vertical-align:middle;}
  .typing-dots span{width:4px;height:4px;border-radius:50%;background:var(--muted);
    animation:barWave 1s ease-in-out infinite;}
  .typing-dots span:nth-child(2){animation-delay:0.15s;}
  .typing-dots span:nth-child(3){animation-delay:0.3s;}
  .status-banner{padding:8px 20px;font-size:11.5px;color:var(--muted);text-align:center;
    background:var(--panel);border-bottom:1px solid var(--line-soft);}

  .compose{display:flex;gap:10px;padding:16px 18px;border-top:1px solid var(--line-soft);
    position:sticky;bottom:0;background:rgba(var(--bg-rgb),0.9);backdrop-filter:blur(10px);
    align-items:flex-end;}
  .compose textarea{flex:1;padding:11px 16px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14.5px;outline:none;resize:none;
    font-family:inherit;line-height:1.4;max-height:120px;overflow-y:auto;
    transition:border-color 0.15s, box-shadow 0.15s;}
  .compose textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,0.1);}
  .compose textarea::placeholder{color:var(--muted-dim);}
  .send-btn{background:linear-gradient(180deg,#f0ae4c,var(--amber));color:#1a1305;border:none;
    border-radius:22px;width:44px;height:44px;flex-shrink:0;font-size:14px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform 0.1s, filter 0.15s;}
  .send-btn:hover{filter:brightness(1.06);transform:translateY(-1px) rotate(2deg);}
  .send-btn:active{transform:translateY(0) rotate(0);}
  .send-btn svg{width:18px;height:18px;}

  .config-error{max-width:460px;margin:80px auto;padding:28px;background:var(--panel);
    border:1px solid var(--danger);border-radius:12px;text-align:center;line-height:1.6;}

  /* Emoji picker */
  .emoji-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);font-size:18px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;}
  .emoji-btn:hover{border-color:var(--amber);}
  .emoji-panel{position:absolute;bottom:48px;left:0;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;
    grid-template-columns:repeat(4,1fr);gap:2px;box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);
    z-index:5;}
  .emoji-opt{width:36px;height:36px;border:none;background:transparent;font-size:19px;
    cursor:pointer;border-radius:8px;}
  .emoji-opt:hover{background:var(--line-soft);}

  /* Reply */
  .reply-btn{background:transparent;border:none;color:var(--muted-dim);cursor:pointer;
    font-size:11px;padding:2px 4px;opacity:0.55;transition:opacity 0.15s;}
  .msg-row:hover .reply-btn{opacity:1;}
  .reply-preview{margin:0 20px 8px 20px;padding:8px 12px;background:var(--panel);
    border-left:3px solid var(--amber);border-radius:6px;display:flex;
    align-items:center;justify-content:space-between;gap:10px;animation:riseIn 0.15s ease;}
  .reply-preview-text{font-size:12px;color:var(--muted);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .reply-preview-text b{color:var(--text);}
  .reply-cancel{background:transparent;border:none;color:var(--muted);cursor:pointer;
    font-size:16px;line-height:1;flex-shrink:0;}
  .quoted-block{padding:6px 10px;margin-bottom:6px;border-left:3px solid rgba(0,0,0,0.2);
    background:rgba(0,0,0,0.08);border-radius:6px;font-size:12px;opacity:0.85;cursor:pointer;}
  .bubble.theirs .quoted-block{border-left-color:var(--amber);background:rgba(232,163,61,0.08);}
  .quoted-sender{font-weight:600;display:block;margin-bottom:1px;}

  /* Seen ticks */
  .seen-tick{font-size:10px;color:var(--muted-dim);margin-left:4px;}
  .seen-tick.seen{color:var(--teal);}

  /* Message action menu */
  .msg-actions{position:relative;display:inline-block;}
  .more-btn{background:transparent;border:none;color:var(--muted-dim);cursor:pointer;
    font-size:13px;padding:2px 6px;opacity:0.55;transition:opacity 0.15s;}
  .msg-row:hover .more-btn{opacity:1;}
  .action-menu{position:absolute;bottom:22px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);overflow:hidden;z-index:6;
    min-width:150px;}
  .msg-row.mine .action-menu{right:0;}
  .msg-row.theirs .action-menu{left:0;}
  .action-menu button{display:block;width:100%;text-align:left;padding:10px 14px;
    background:transparent;border:none;color:var(--text);font-size:13px;cursor:pointer;}
  .action-menu button:hover{background:var(--line-soft);}
  .action-menu button.danger{color:var(--danger);}
  .msg-deleted{font-style:italic;color:var(--muted-dim);}

  /* ===== Responsive: tighten up for phones ===== */
  @media (max-width: 480px){
    .join-wrap{padding:18px;}
    .join-card{padding:26px 20px;border-radius:12px;}
    .join-title{font-size:23px;margin:8px 0 20px 0;}
    .field-input{padding:11px 13px;font-size:14.5px;}
    .theme-toggle{top:12px;right:12px;width:34px;height:34px;}
    .chat-header{padding:12px 14px;}
    .avatar-ring{width:30px;height:30px;font-size:12px;}
    .room-name{font-size:13px;}
    .as-name{font-size:11px;}
    .msg-list{padding:14px;gap:10px;}
    .msg-row{max-width:86%;}
    .bubble{font-size:14px;padding:9px 12px;}
    .compose{padding:12px;gap:8px;}
    .compose input{padding:10px 14px;font-size:14px;}
    .send-btn{width:40px;height:40px;}
  }
  /* ===== Responsive: give PC/desktop a bit more breathing room ===== */
  @media (min-width: 900px){
    .chat-wrap{max-width:680px;}
    .msg-list{padding:28px 34px;}
    .compose{padding:18px 28px;}
    .chat-header{padding:18px 28px;}
    .msg-row{max-width:68%;}
  }
  @media (min-width: 1300px){
    .chat-wrap{max-width:760px;}
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark theme">
  <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
</button>

<div id="root"></div>

<!-- Firebase SDKs (compat build — simplest for a plain HTML file) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
  // ---- Theme toggle (in-memory only; resets on reload) ----
  (function(){
    const sunPath = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
    const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>';
    const btn = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');
    let isLight = false;

    function applyTheme(){
      document.body.setAttribute('data-theme', isLight ? 'light' : 'dark');
      icon.innerHTML = isLight ? sunPath : moonPath;
    }
    btn.addEventListener('click', () => {
      isLight = !isLight;
      applyTheme();
    });
    applyTheme();
  })();
</script>

<script>

const firebaseConfig = {

  projectId: "my-chat-app-ffa39",
  storageBucket: "my-chat-app-ffa39.firebasestorage.app",
  messagingSenderId: "74980687317",
  appId: "1:74980687317:web:31c0933b4d9b2fc398915c"
};
/* ====================================================================== */

let db = null;
let configOk = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("PASTE_") !== 0;

if (configOk) {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    configOk = false;
  }
}

(function(){
  let session = null; // { room, name, myId }
  let roomRef = null;
  let presenceRef = null;
  let presenceListRef = null;
  let typingRef = null;
  let typingListRef = null;
  let typingClearTimer = null;
  let readsRef = null;
  let readsListRef = null;
  let myId = null;
  let lastMessageList = [];
  let lastRenderedCount = 0;
  let otherReadTs = 0;
  let replyTarget = null; // { id, sender, text }
  let emojiOpen = false;
  let locallyDeletedIds = new Set(); // "delete for me" — in-memory only, resets on reload
  let openMenuId = null;
  let hasLoadedOnce = false;
  let audioCtx = null;

  const EMOJI_LIST = ['😀','😂','😍','😊','👍','🙏','😢','😮','🎉','❤️','🔥','😅','🤔','👏','😴','😭'];

  function genId(){ return Math.random().toString(36).slice(2,10); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function initials(name){
    const parts = name.trim().split(/\s+/);
    const chars = parts.slice(0,2).map(p => p[0] ? p[0].toUpperCase() : '');
    return chars.join('') || '?';
  }
  function fmtTime(ts){
    const d = new Date(ts);
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  }
  function roomKey(room){
    // Firebase keys can't contain . # $ [ ] /
    return room.replace(/[.#$\[\]\/]/g, '_');
  }

  function render(){
    const root = document.getElementById('root');

    if (!configOk){
      root.innerHTML = `
        <div class="config-error">
          <div style="font-size:20px;font-weight:700;margin-bottom:10px;">Firebase not configured</div>
          <div style="color:var(--muted);font-size:13.5px;">
            Open this file's source and paste your Firebase project config into the
            <span class="mono" style="color:var(--amber);">firebaseConfig</span> object near the top of the &lt;script&gt; tag.
          </div>
        </div>`;
      return;
    }

    if (!session){
      root.innerHTML = joinScreenHTML();
      wireJoinScreen();
    } else {
      root.innerHTML = chatScreenHTML();
      wireChatScreen();
    }
  }

  function joinScreenHTML(){
    return `
      <div class="join-wrap">
        <div class="signal-hero">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="join-card">
          <div><span class="dot live"></span><span class="eyebrow">channel link</span></div>
          <div class="join-title">Open a line</div>

          <label class="field-label">Your name</label>
          <input class="field-input" id="nameInput" placeholder="e.g. Nadeesha" autocomplete="off" />

          <label class="field-label">Channel code</label>
          <input class="field-input mono" id="roomInput" placeholder="e.g. sanduni-kasun-2026" autocomplete="off" />
          <p class="hint">Pick any code and share it with the other person — they enter the exact same code to join this channel from wherever they are.</p>

          <button class="join-btn" id="joinBtn" disabled>Join channel</button>
        </div>
        <p class="footnote mono">real-time · works across any devices, anywhere</p>
      </div>
    `;
  }

  function wireJoinScreen(){
    const nameInput = document.getElementById('nameInput');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');

    function updateBtn(){
      const ok = nameInput.value.trim().length > 0 && roomInput.value.trim().length > 0;
      joinBtn.disabled = !ok;
    }
    nameInput.addEventListener('input', updateBtn);
    roomInput.addEventListener('input', () => {
      roomInput.value = roomInput.value.replace(/\s/g,'');
      updateBtn();
    });
    function tryJoin(){
      if (joinBtn.disabled) return;
      myId = genId();
      session = {
        room: roomInput.value.trim(),
        name: nameInput.value.trim()
      };
      render();
      startListening();
    }
    joinBtn.addEventListener('click', tryJoin);
    roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryJoin(); });
    nameInput.focus();
  }

  function chatScreenHTML(){
    return `
      <div class="chat-wrap">
        <div class="chat-header">
          <div class="header-left">
            <div class="avatar-ring">${esc(initials(session.name))}</div>
            <div>
              <div class="room-name mono">${esc(session.room)}</div>
              <div class="as-name" id="presenceLine">signed in as ${esc(session.name)}</div>
            </div>
          </div>
          <button class="leave-btn" id="leaveBtn">Leave</button>
        </div>

        <div class="msg-list" id="msgList">
          <div class="empty-state" id="loadingState">connecting…</div>
        </div>

        <div id="typingLine"></div>
        <div id="errorLine"></div>
        <div id="replyPreview"></div>

        <div class="compose">
          <div style="position:relative;">
            <button class="emoji-btn" id="emojiBtn" type="button" aria-label="Emoji">🙂</button>
            <div class="emoji-panel" id="emojiPanel" style="display:none;">
              ${EMOJI_LIST.map(e => `<button type="button" class="emoji-opt" data-emoji="${e}">${e}</button>`).join('')}
            </div>
          </div>
          <textarea id="draftInput" rows="1" placeholder="Type a message… (Shift+Enter for new line)" autocomplete="off"></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 11.5L20.5 3.5L13 21L11 13.5L3 11.5Z" stroke="#1a1305" stroke-width="1.8" stroke-linejoin="round" fill="#1a1305" fill-opacity="0.08"/>
            </svg>
          </button>
        </div>
      </div>
    `;
  }

  function wireChatScreen(){
    document.getElementById('leaveBtn').addEventListener('click', () => {
      stopListening();
      session = null;
      render();
    });
    const draftInput = document.getElementById('draftInput');
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.addEventListener('click', sendMessage);
    draftInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
      // Enter+Shift: let the browser insert a newline normally.
    });
    draftInput.addEventListener('input', () => {
      handleTypingInput();
      autoResizeTextarea(draftInput);
    });

    const emojiBtn = document.getElementById('emojiBtn');
    const emojiPanel = document.getElementById('emojiPanel');
    emojiBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      emojiOpen = !emojiOpen;
      emojiPanel.style.display = emojiOpen ? 'grid' : 'none';
    });
    emojiPanel.addEventListener('click', (e) => {
      const btn = e.target.closest('.emoji-opt');
      if (!btn) return;
      draftInput.value += btn.getAttribute('data-emoji');
      draftInput.focus();
    });
    document.addEventListener('click', (e) => {
      if (emojiOpen && !emojiPanel.contains(e.target) && e.target !== emojiBtn){
        emojiOpen = false;
        emojiPanel.style.display = 'none';
      }
      if (openMenuId && !e.target.closest('.msg-actions')){
        openMenuId = null;
        renderMessages(lastMessageList);
      }
    });

    renderReplyPreview();
    startTyping();
    startReads();
    draftInput.focus();

    const msgList = document.getElementById('msgList');
    msgList.addEventListener('click', (e) => {
      const moreBtn = e.target.closest('.more-btn');
      if (moreBtn){
        const id = moreBtn.getAttribute('data-menu-id');
        openMenuId = (openMenuId === id) ? null : id;
        renderMessages(lastMessageList);
        return;
      }

      const actionBtn = e.target.closest('[data-action]');
      if (actionBtn){
        const action = actionBtn.getAttribute('data-action');
        const id = actionBtn.getAttribute('data-id');
        openMenuId = null;
        if (action === 'delete-me'){
          locallyDeletedIds.add(id);
          renderMessages(lastMessageList);
        } else if (action === 'delete-everyone'){
          db.ref('rooms/' + roomKey(session.room) + '/messages/' + id).update({
            deleted: true, text: '', replyTo: null
          });
        }
        return;
      }

      const replyBtn = e.target.closest('.reply-btn');
      if (replyBtn){
        const id = replyBtn.getAttribute('data-reply-id');
        const found = lastMessageList.find(m => m.id === id);
        if (found){
          replyTarget = { id: found.id, sender: found.sender, text: found.text };
          renderReplyPreview();
          document.getElementById('draftInput').focus();
        }
        return;
      }
      const quoted = e.target.closest('.quoted-block');
      if (quoted){
        const jumpId = quoted.getAttribute('data-jump');
        if (jumpId){
          const el = msgList.querySelector(`[data-id="${jumpId}"]`);
          if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
        }
      }
    });
  }

  function renderReplyPreview(){
    const box = document.getElementById('replyPreview');
    if (!box) return;
    if (!replyTarget){
      box.innerHTML = '';
      return;
    }
    box.innerHTML = `
      <div class="reply-preview">
        <div class="reply-preview-text">Replying to <b>${esc(replyTarget.sender)}</b>: ${esc(truncate(replyTarget.text, 50))}</div>
        <button class="reply-cancel" id="cancelReplyBtn" type="button">✕</button>
      </div>`;
    const cancelBtn = document.getElementById('cancelReplyBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', () => {
      replyTarget = null;
      renderReplyPreview();
    });
  }

  function renderMessages(list){
    lastMessageList = list;
    const msgList = document.getElementById('msgList');
    if (!msgList) return;

    const visibleList = list.filter(m => !locallyDeletedIds.has(m.id));

    const isNewArrival = visibleList.length > lastRenderedCount;
    const wasAtBottom = isNearBottom();
    lastRenderedCount = visibleList.length;

    if (visibleList.length === 0){
      msgList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
          No messages yet.<br/>Say something to open the line.
        </div>`;
      return;
    }

    const byId = {};
    list.forEach(m => { byId[m.id] = m; });

    msgList.innerHTML = visibleList.map(m => {
      const mine = m.senderId === myId;
      const senderLabel = mine ? '' : `<div class="sender-label">${esc(m.sender)}</div>`;

      if (m.deleted){
        return `
          <div class="msg-row ${mine ? 'mine' : 'theirs'}" data-id="${esc(m.id)}">
            ${senderLabel}
            <div class="bubble ${mine ? 'mine' : 'theirs'}"><span class="msg-deleted">🚫 This message was deleted</span></div>
            <div class="time-label">${fmtTime(m.ts)}</div>
          </div>
        `;
      }

      let quoted = '';
      if (m.replyTo){
        const stillThere = byId[m.replyTo.id] && !byId[m.replyTo.id].deleted;
        quoted = `<div class="quoted-block" ${stillThere ? `data-jump="${esc(m.replyTo.id)}"` : ''}>
          <span class="quoted-sender">${esc(m.replyTo.sender)}</span>${esc(truncate(m.replyTo.text, 60))}
        </div>`;
      }

      let seenTick = '';
      if (mine){
        const seen = otherReadTs >= m.ts;
        seenTick = `<span class="seen-tick ${seen ? 'seen' : ''}">${seen ? '✓✓ Seen' : '✓ Sent'}</span>`;
      }

      const menuOptions = mine
        ? `<button data-action="delete-everyone" data-id="${esc(m.id)}">Delete for everyone</button>
           <button data-action="delete-me" data-id="${esc(m.id)}">Delete for me</button>`
        : `<button data-action="delete-me" data-id="${esc(m.id)}">Delete for me</button>`;

      const menuOpen = openMenuId === m.id;

      return `
        <div class="msg-row ${mine ? 'mine' : 'theirs'}" data-id="${esc(m.id)}">
          ${senderLabel}
          <div class="bubble ${mine ? 'mine' : 'theirs'}">${quoted}${escMultiline(m.text)}</div>
          <div class="time-label">
            <span class="msg-actions">
              <button class="more-btn" data-menu-id="${esc(m.id)}" type="button">⋮</button>
              ${menuOpen ? `<div class="action-menu">${menuOptions}</div>` : ''}
            </span>
            <button class="reply-btn" data-reply-id="${esc(m.id)}">↩ reply</button>
            ${fmtTime(m.ts)}${seenTick}
          </div>
        </div>
      `;
    }).join('');

    // Auto-scroll: jump to newest message if we were already near the bottom,
    // or if the newest message is one we just sent ourselves.
    const newest = visibleList[visibleList.length - 1];
    if (wasAtBottom || (isNewArrival && newest && newest.senderId === myId)){
      scrollToBottom();
    }

    // Play a soft notification sound when a new message arrives from the other person
    // (but never on the very first load, which would replay the whole history).
    if (hasLoadedOnce && isNewArrival && newest && newest.senderId !== myId){
      playNotifySound();
    }
    hasLoadedOnce = true;

    markRead(list);
  }

  function playNotifySound(){
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(660, now + 0.12);

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.18, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } catch (e) {
      // Audio may be blocked before any user interaction — safe to ignore.
    }
  }

  function escMultiline(s){
    return esc(s).replace(/\n/g, '<br>');
  }

  function truncate(s, n){
    s = String(s);
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  function autoResizeTextarea(el){
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function isNearBottom(){
    const msgList = document.getElementById('msgList');
    if (!msgList) return true;
    return msgList.scrollHeight - msgList.scrollTop - msgList.clientHeight < 90;
  }

  function scrollToBottom(){
    const msgList = document.getElementById('msgList');
    if (msgList) msgList.scrollTop = msgList.scrollHeight;
  }

  function startListening(){
    roomRef = db.ref('rooms/' + roomKey(session.room) + '/messages');
    roomRef.on('value', (snapshot) => {
      const val = snapshot.val() || {};
      const list = Object.keys(val).map(k => Object.assign({ id: k }, val[k])).sort((a,b) => a.ts - b.ts);
      renderMessages(list);
    }, (err) => {
      const errorLine = document.getElementById('errorLine');
      if (errorLine) errorLine.innerHTML = '<div class="error-line">Connection error — check your Firebase config and database rules.</div>';
    });

    startPresence();
  }

  function stopListening(){
    if (roomRef) roomRef.off();
    roomRef = null;
    stopPresence();
    stopTyping();
    stopReads();
    replyTarget = null;
    locallyDeletedIds = new Set();
    openMenuId = null;
    hasLoadedOnce = false;
    lastRenderedCount = 0;
  }

  function startTyping(){
    typingRef = db.ref('rooms/' + roomKey(session.room) + '/typing/' + myId);
    typingListRef = db.ref('rooms/' + roomKey(session.room) + '/typing');
    typingRef.onDisconnect().remove();

    typingListRef.on('value', (snapshot) => {
      const val = snapshot.val() || {};
      const others = Object.keys(val)
        .filter(k => k !== myId)
        .map(k => val[k])
        .filter(p => Date.now() - p.ts < 6000); // ignore stale entries
      renderTyping(others);
    });
  }

  function handleTypingInput(){
    if (!typingRef) return;
    typingRef.set({ name: session.name, ts: Date.now() });
    if (typingClearTimer) clearTimeout(typingClearTimer);
    typingClearTimer = setTimeout(() => {
      if (typingRef) typingRef.remove();
    }, 2000);
  }

  function stopTyping(){
    if (typingClearTimer) clearTimeout(typingClearTimer);
    typingClearTimer = null;
    if (typingRef) typingRef.remove();
    if (typingListRef) typingListRef.off();
    typingRef = null;
    typingListRef = null;
  }

  function renderTyping(others){
    const line = document.getElementById('typingLine');
    if (!line) return;
    if (others.length === 0){
      line.innerHTML = '';
      return;
    }
    const names = others.map(p => esc(p.name)).join(', ');
    line.innerHTML = `<div class="typing-line">${names} typing<span class="typing-dots"><span></span><span></span><span></span></span></div>`;
  }

  function startPresence(){
    presenceRef = db.ref('rooms/' + roomKey(session.room) + '/presence/' + myId);
    presenceListRef = db.ref('rooms/' + roomKey(session.room) + '/presence');

    // Only write our own presence once we know we're actually connected.
    db.ref('.info/connected').on('value', (snap) => {
      if (snap.val() === true) {
        presenceRef.onDisconnect().remove();
        presenceRef.set({ name: session.name, ts: Date.now() });
      }
    });

    presenceListRef.on('value', (snapshot) => {
      const val = snapshot.val() || {};
      const people = Object.keys(val).map(k => val[k]);
      renderPresence(people);
    });
  }

  function startReads(){
    readsRef = db.ref('rooms/' + roomKey(session.room) + '/reads/' + myId);
    readsListRef = db.ref('rooms/' + roomKey(session.room) + '/reads');

    readsListRef.on('value', (snapshot) => {
      const val = snapshot.val() || {};
      let maxOther = 0;
      Object.keys(val).forEach(k => {
        if (k !== myId && val[k] && val[k].ts > maxOther) maxOther = val[k].ts;
      });
      otherReadTs = maxOther;
      renderMessages(lastMessageList);
    });
  }

  function stopReads(){
    if (readsListRef) readsListRef.off();
    readsRef = null;
    readsListRef = null;
    otherReadTs = 0;
  }

  function markRead(list){
    if (!readsRef || list.length === 0) return;
    const newest = list[list.length - 1];
    readsRef.set({ ts: newest.ts });
  }

  function stopPresence(){
    if (presenceRef) presenceRef.remove();
    if (presenceListRef) presenceListRef.off();
    db.ref('.info/connected').off();
    presenceRef = null;
    presenceListRef = null;
  }

  function renderPresence(people){
    const line = document.getElementById('presenceLine');
    if (!line) return;
    const count = people.length;
    if (count <= 1){
      line.innerHTML = `signed in as ${esc(session.name)}`;
      return;
    }
    const names = people.map(p => esc(p.name)).join(', ');
    line.innerHTML = `<span class="presence-dot"></span>${count} online — ${names}`;
  }

  async function sendMessage(){
    const draftInput = document.getElementById('draftInput');
    const text = draftInput.value.trim();
    if (!text || !roomRef) return;
    draftInput.value = '';
    autoResizeTextarea(draftInput);
    const errorLine = document.getElementById('errorLine');
    if (errorLine) errorLine.innerHTML = '';
    if (typingClearTimer) clearTimeout(typingClearTimer);
    if (typingRef) typingRef.remove();

    const payload = {
      sender: session.name,
      senderId: myId,
      text: text,
      ts: Date.now()
    };
    if (replyTarget){
      payload.replyTo = { id: replyTarget.id, sender: replyTarget.sender, text: replyTarget.text };
    }

    try {
      await roomRef.push(payload);
      replyTarget = null;
      renderReplyPreview();
    } catch (e) {
      if (errorLine) errorLine.innerHTML = '<div class="error-line">Could not send message. Check your connection.</div>';
    }
  }

  render();
})();
</script>
</body>
</html>
