<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Open a Line — Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0f18;
    --bg-glow: radial-gradient(circle at 20% -10%, rgba(232,163,61,0.10), transparent 45%),
               radial-gradient(circle at 100% 10%, rgba(73,198,184,0.08), transparent 40%);
    --panel:#121a28;
    --panel-2:#161f30;
    --line:#22304a;
    --line-soft:#1a2438;
    --amber:#e8a33d;
    --teal:#49c6b8;
    --text:#eef2f7;
    --muted:#7c8aa0;
    --muted-dim:#556076;
    --danger:#e87d5b;
    --disp: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg) var(--bg-glow) no-repeat;background-attachment:fixed;
    color:var(--text);font-family:var(--disp);-webkit-font-smoothing:antialiased;}
  #root{min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .mono{font-family:var(--mono);}
  input{font-family:inherit;}
  button{font-family:inherit;}
  ::selection{background:rgba(232,163,61,0.3);}

  .msg-list::-webkit-scrollbar{width:6px;}
  .msg-list::-webkit-scrollbar-track{background:transparent;}
  .msg-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  .msg-list::-webkit-scrollbar-thumb:hover{background:var(--muted-dim);}

  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,163,61,0.45); }
    50%{ box-shadow:0 0 0 6px rgba(232,163,61,0); }
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes barWave{
    0%,100%{ transform:scaleY(0.35); }
    50%{ transform:scaleY(1); }
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  .join-wrap{min-height:100vh;width:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:28px;animation:fadeIn 0.4s ease;}

  .signal-hero{display:flex;align-items:flex-end;gap:4px;height:36px;margin-bottom:22px;}
  .signal-hero .bar{width:5px;border-radius:3px;
    background:linear-gradient(180deg,var(--amber),var(--teal));
    animation:barWave 1.4s ease-in-out infinite;transform-origin:bottom;}
  .signal-hero .bar:nth-child(1){height:14px;animation-delay:0s;}
  .signal-hero .bar:nth-child(2){height:24px;animation-delay:0.12s;}
  .signal-hero .bar:nth-child(3){height:36px;animation-delay:0.24s;}
  .signal-hero .bar:nth-child(4){height:20px;animation-delay:0.36s;}
  .signal-hero .bar:nth-child(5){height:30px;animation-delay:0.48s;}
  .signal-hero .bar:nth-child(6){height:12px;animation-delay:0.6s;}

  .join-card{width:100%;max-width:390px;background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:14px;padding:34px 30px;
    box-shadow:0 20px 60px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 10px var(--amber);display:inline-block;animation:pulse 2s infinite;}
  .dot.live{background:var(--teal);box-shadow:0 0 10px var(--teal);}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:0.18em;color:var(--muted);
    text-transform:uppercase;vertical-align:middle;margin-left:8px;}
  .join-title{font-size:28px;font-weight:700;margin:10px 0 26px 0;letter-spacing:-0.02em;}

  .field-label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:7px;
    letter-spacing:0.03em;text-transform:uppercase;}
  .field-input{width:100%;padding:12px 14px;margin-bottom:20px;border-radius:8px;
    border:1px solid var(--line);background:#0c1420;color:var(--text);
    font-size:15px;outline:none;transition:border-color 0.15s, box-shadow 0.15s;}
  .field-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,0.12);}
  .field-input::placeholder{color:var(--muted-dim);}

  .hint{font-size:12.5px;color:var(--muted);margin:-8px 0 24px 0;line-height:1.55;}
  .join-btn{width:100%;padding:13px;border-radius:8px;border:none;
    background:linear-gradient(180deg,#f0ae4c,var(--amber));color:#1a1305;font-size:15px;font-weight:700;
    cursor:pointer;letter-spacing:0.01em;transition:transform 0.1s, filter 0.15s;}
  .join-btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px);}
  .join-btn:active:not(:disabled){transform:translateY(0);}
  .join-btn:disabled{background:#1c2536;color:var(--muted-dim);cursor:not-allowed;}
  .footnote{margin-top:18px;font-size:11.5px;color:var(--muted-dim);text-align:center;max-width:320px;line-height:1.5;}

  .chat-wrap{width:100%;max-width:540px;min-height:100vh;display:flex;flex-direction:column;animation:fadeIn 0.3s ease;}
  .chat-header{padding:16px 20px;border-bottom:1px solid var(--line-soft);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;background:rgba(10,15,24,0.85);backdrop-filter:blur(10px);z-index:2;}
  .header-left{display:flex;align-items:center;gap:12px;}
  .avatar-ring{width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(135deg,var(--teal),#2f8a80);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:600;font-size:13px;color:#06231f;
    box-shadow:0 0 0 3px rgba(73,198,184,0.12);}
  .room-name{font-size:14px;font-weight:600;letter-spacing:0.01em;}
  .as-name{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .leave-btn{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:7px;padding:7px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
  .leave-btn:hover{border-color:var(--danger);color:var(--danger);}

  .msg-list{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;}
  .empty-state{color:var(--muted);font-size:13px;text-align:center;margin-top:60px;line-height:1.7;}
  .empty-icon{display:flex;justify-content:center;gap:3px;margin-bottom:14px;opacity:0.5;}
  .empty-icon .bar{width:4px;border-radius:2px;background:var(--muted);}
  .empty-icon .bar:nth-child(1){height:8px;}
  .empty-icon .bar:nth-child(2){height:16px;}
  .empty-icon .bar:nth-child(3){height:22px;}
  .empty-icon .bar:nth-child(4){height:12px;}

  .msg-row{max-width:76%;display:flex;flex-direction:column;animation:riseIn 0.25s ease;}
  .msg-row.mine{align-self:flex-end;align-items:flex-end;}
  .msg-row.theirs{align-self:flex-start;align-items:flex-start;}
  .sender-label{font-size:11px;color:var(--muted);margin-bottom:4px;margin-left:4px;font-weight:500;}
  .bubble{padding:10px 14px;font-size:14.5px;line-height:1.5;word-break:break-word;}
  .bubble.mine{background:linear-gradient(135deg,#f0ae4c,var(--amber));color:#1a1305;
    border-radius:14px 14px 3px 14px;box-shadow:0 4px 14px -6px rgba(232,163,61,0.4);}
  .bubble.theirs{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:14px 14px 14px 3px;}
  .time-label{font-size:10px;color:var(--muted-dim);margin-top:4px;margin-left:5px;margin-right:5px;
    font-family:var(--mono);}

  .error-line{padding:6px 20px;font-size:12px;color:var(--danger);animation:riseIn 0.2s ease;}
  .status-banner{padding:8px 20px;font-size:11.5px;color:var(--muted);text-align:center;
    background:var(--panel);border-bottom:1px solid var(--line-soft);}

  .compose{display:flex;gap:10px;padding:16px 18px;border-top:1px solid var(--line-soft);
    position:sticky;bottom:0;background:rgba(10,15,24,0.9);backdrop-filter:blur(10px);}
  .compose input{flex:1;padding:12px 16px;border-radius:22px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14.5px;outline:none;
    transition:border-color 0.15s, box-shadow 0.15s;}
  .compose input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,163,61,0.1);}
  .compose input::placeholder{color:var(--muted-dim);}
  .send-btn{background:linear-gradient(180deg,#f0ae4c,var(--amber));color:#1a1305;border:none;
    border-radius:22px;width:44px;height:44px;flex-shrink:0;font-size:14px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform 0.1s, filter 0.15s;}
  .send-btn:hover{filter:brightness(1.06);transform:translateY(-1px) rotate(2deg);}
  .send-btn:active{transform:translateY(0) rotate(0);}
  .send-btn svg{width:18px;height:18px;}

  .config-error{max-width:460px;margin:80px auto;padding:28px;background:var(--panel);
    border:1px solid var(--danger);border-radius:12px;text-align:center;line-height:1.6;}
</style>
</head>
<body>

<div id="root"></div>

<!-- Firebase SDKs (compat build — simplest for a plain HTML file) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<script>
/* ======================================================================
   1) PASTE YOUR FIREBASE CONFIG BELOW.
   Get this from: Firebase Console → Project settings → General →
   "Your apps" → Web app → SDK setup and configuration → Config.
   ====================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyD-4F7ysil3ZFOeGyXLv1MIPP0bw4zwfVE",
  authDomain: "my-chat-app-ffa39.firebaseapp.com",
  databaseURL: "https://my-chat-app-ffa39-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-chat-app-ffa39",
  storageBucket: "my-chat-app-ffa39.firebasestorage.app",
  messagingSenderId: "74980687317",
  appId: "1:74980687317:web:31c0933b4d9b2fc398915c"
};
/* ====================================================================== */

let db = null;
let configOk = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("PASTE_") !== 0;

if (configOk) {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    configOk = false;
  }
}

(function(){
  let session = null; // { room, name, myId }
  let roomRef = null;
  let myId = null;

  function genId(){ return Math.random().toString(36).slice(2,10); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function initials(name){
    const parts = name.trim().split(/\s+/);
    const chars = parts.slice(0,2).map(p => p[0] ? p[0].toUpperCase() : '');
    return chars.join('') || '?';
  }
  function fmtTime(ts){
    const d = new Date(ts);
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  }
  function roomKey(room){
    // Firebase keys can't contain . # $ [ ] /
    return room.replace(/[.#$\[\]\/]/g, '_');
  }

  function render(){
    const root = document.getElementById('root');

    if (!configOk){
      root.innerHTML = `
        <div class="config-error">
          <div style="font-size:20px;font-weight:700;margin-bottom:10px;">Firebase not configured</div>
          <div style="color:var(--muted);font-size:13.5px;">
            Open this file's source and paste your Firebase project config into the
            <span class="mono" style="color:var(--amber);">firebaseConfig</span> object near the top of the &lt;script&gt; tag.
          </div>
        </div>`;
      return;
    }

    if (!session){
      root.innerHTML = joinScreenHTML();
      wireJoinScreen();
    } else {
      root.innerHTML = chatScreenHTML();
      wireChatScreen();
    }
  }

  function joinScreenHTML(){
    return `
      <div class="join-wrap">
        <div class="signal-hero">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="join-card">
          <div><span class="dot live"></span><span class="eyebrow">channel link</span></div>
          <div class="join-title">Open a line</div>

          <label class="field-label">Your name</label>
          <input class="field-input" id="nameInput" placeholder="e.g. Nadeesha" autocomplete="off" />

          <label class="field-label">Channel code</label>
          <input class="field-input mono" id="roomInput" placeholder="e.g. sanduni-kasun-2026" autocomplete="off" />
          <p class="hint">Pick any code and share it with the other person — they enter the exact same code to join this channel from wherever they are.</p>

          <button class="join-btn" id="joinBtn" disabled>Join channel</button>
        </div>
        <p class="footnote mono">real-time · works across any devices, anywhere</p>
      </div>
    `;
  }

  function wireJoinScreen(){
    const nameInput = document.getElementById('nameInput');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');

    function updateBtn(){
      const ok = nameInput.value.trim().length > 0 && roomInput.value.trim().length > 0;
      joinBtn.disabled = !ok;
    }
    nameInput.addEventListener('input', updateBtn);
    roomInput.addEventListener('input', () => {
      roomInput.value = roomInput.value.replace(/\s/g,'');
      updateBtn();
    });
    function tryJoin(){
      if (joinBtn.disabled) return;
      myId = genId();
      session = {
        room: roomInput.value.trim(),
        name: nameInput.value.trim()
      };
      render();
      startListening();
    }
    joinBtn.addEventListener('click', tryJoin);
    roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryJoin(); });
    nameInput.focus();
  }

  function chatScreenHTML(){
    return `
      <div class="chat-wrap">
        <div class="chat-header">
          <div class="header-left">
            <div class="avatar-ring">${esc(initials(session.name))}</div>
            <div>
              <div class="room-name mono">${esc(session.room)}</div>
              <div class="as-name">signed in as ${esc(session.name)}</div>
            </div>
          </div>
          <button class="leave-btn" id="leaveBtn">Leave</button>
        </div>

        <div class="msg-list" id="msgList">
          <div class="empty-state" id="loadingState">connecting…</div>
        </div>

        <div id="errorLine"></div>

        <div class="compose">
          <input id="draftInput" placeholder="Type a message…" autocomplete="off" />
          <button class="send-btn" id="sendBtn" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 11.5L20.5 3.5L13 21L11 13.5L3 11.5Z" stroke="#1a1305" stroke-width="1.8" stroke-linejoin="round" fill="#1a1305" fill-opacity="0.08"/>
            </svg>
          </button>
        </div>
      </div>
    `;
  }

  function wireChatScreen(){
    document.getElementById('leaveBtn').addEventListener('click', () => {
      stopListening();
      session = null;
      render();
    });
    const draftInput = document.getElementById('draftInput');
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.addEventListener('click', sendMessage);
    draftInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    draftInput.focus();
  }

  function renderMessages(list){
    const msgList = document.getElementById('msgList');
    if (!msgList) return;
    if (list.length === 0){
      msgList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
          No messages yet.<br/>Say something to open the line.
        </div>`;
      return;
    }
    msgList.innerHTML = list.map(m => {
      const mine = m.senderId === myId;
      const senderLabel = mine ? '' : `<div class="sender-label">${esc(m.sender)}</div>`;
      return `
        <div class="msg-row ${mine ? 'mine' : 'theirs'}">
          ${senderLabel}
          <div class="bubble ${mine ? 'mine' : 'theirs'}">${esc(m.text)}</div>
          <div class="time-label">${fmtTime(m.ts)}</div>
        </div>
      `;
    }).join('');
    scrollToBottom();
  }

  function scrollToBottom(){
    const msgList = document.getElementById('msgList');
    if (msgList) msgList.scrollTop = msgList.scrollHeight;
  }

  function startListening(){
    roomRef = db.ref('rooms/' + roomKey(session.room) + '/messages');
    roomRef.on('value', (snapshot) => {
      const val = snapshot.val() || {};
      const list = Object.keys(val).map(k => val[k]).sort((a,b) => a.ts - b.ts);
      renderMessages(list);
    }, (err) => {
      const errorLine = document.getElementById('errorLine');
      if (errorLine) errorLine.innerHTML = '<div class="error-line">Connection error — check your Firebase config and database rules.</div>';
    });
  }

  function stopListening(){
    if (roomRef) roomRef.off();
    roomRef = null;
  }

  async function sendMessage(){
    const draftInput = document.getElementById('draftInput');
    const text = draftInput.value.trim();
    if (!text || !roomRef) return;
    draftInput.value = '';
    const errorLine = document.getElementById('errorLine');
    if (errorLine) errorLine.innerHTML = '';

    try {
      await roomRef.push({
        sender: session.name,
        senderId: myId,
        text: text,
        ts: Date.now()
      });
    } catch (e) {
      if (errorLine) errorLine.innerHTML = '<div class="error-line">Could not send message. Check your connection.</div>';
    }
  }

  render();
})();
</script>
</body>
</html>
